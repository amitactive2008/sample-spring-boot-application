#cloud-config

write_files:

  - path: /etc/issue-tracker/auth-service.env
    owner: root:root
    permissions: '0640'
    content: |
      SPRING_PROFILES_ACTIVE=prod
      SERVER_PORT=8097
      SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME=appuser
      SPRING_DATASOURCE_PASSWORD=StrongPass@2024!
      JWT_SECRET=ReplaceThisWithASecureSecretKeyOfAtLeast32Chars
      JWT_EXPIRATIONMINUTES=60
      APP_ADMIN_EMAIL=admin@example.com
      APP_ADMIN_PASSWORD=Admin@2024!
      MAIL_ENABLED=false
      SES_USERNAME=not-configured
      SES_PASSWORD=not-configured

  - path: /etc/issue-tracker/issue-service.env
    owner: root:root
    permissions: '0640'
    content: |
      SPRING_PROFILES_ACTIVE=prod
      SERVER_PORT=8098
      SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/issuedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME=appuser
      SPRING_DATASOURCE_PASSWORD=StrongPass@2024!
      JWT_SECRET=ReplaceThisWithASecureSecretKeyOfAtLeast32Chars
      JWT_EXPIRATIONMINUTES=60

  - path: /etc/issue-tracker/api-gateway.env
    owner: root:root
    permissions: '0640'
    content: |
      SPRING_PROFILES_ACTIVE=local
      SERVER_PORT=8096
      JWT_SECRET=ReplaceThisWithASecureSecretKeyOfAtLeast32Chars
      CORS_ALLOWED_ORIGIN=*

  - path: /etc/systemd/system/auth-service.service
    content: |
      [Unit]
      Description=Issue Tracker - Auth Service (port 8097)
      After=network.target mysql.service
      Requires=mysql.service
      [Service]
      Type=simple
      User=issueapp
      Group=issueapp
      EnvironmentFile=/etc/issue-tracker/auth-service.env
      ExecStart=/usr/bin/java -jar /opt/issue-tracker/auth-service/target/auth-service-0.0.1-SNAPSHOT.jar
      Restart=on-failure
      RestartSec=15
      SuccessExitStatus=143
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=auth-service
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/issue-service.service
    content: |
      [Unit]
      Description=Issue Tracker - Issue Service (port 8098)
      After=network.target mysql.service
      Requires=mysql.service
      [Service]
      Type=simple
      User=issueapp
      Group=issueapp
      EnvironmentFile=/etc/issue-tracker/issue-service.env
      ExecStart=/usr/bin/java -jar /opt/issue-tracker/issue-service/target/issue-service-0.0.1-SNAPSHOT.jar
      Restart=on-failure
      RestartSec=15
      SuccessExitStatus=143
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=issue-service
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/api-gateway.service
    content: |
      [Unit]
      Description=Issue Tracker - API Gateway (port 8096)
      After=network.target auth-service.service issue-service.service
      [Service]
      Type=simple
      User=issueapp
      Group=issueapp
      EnvironmentFile=/etc/issue-tracker/api-gateway.env
      ExecStart=/usr/bin/java -jar /opt/issue-tracker/api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar
      Restart=on-failure
      RestartSec=15
      SuccessExitStatus=143
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=api-gateway
      [Install]
      WantedBy=multi-user.target

  - path: /etc/nginx/sites-available/issue-tracker
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          root /opt/issue-tracker/frontend-service/build;
          index index.html;
          location /auth/ {
              proxy_pass http://127.0.0.1:8096;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }
          location /issues {
              proxy_pass http://127.0.0.1:8096;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }
          location / {
              try_files $uri $uri/ /index.html;
          }
      }

  - path: /opt/provision.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -Eeuo pipefail
      exec > >(tee -a /var/log/issue-tracker-setup.log) 2>&1
      trap 'status=$?; echo "=== Provisioning failed at line ${LINENO} (exit ${status}): ${BASH_COMMAND} ==="; exit "${status}"' ERR
      echo "=== Provisioning started: $(date) ==="

      export DEBIAN_FRONTEND=noninteractive
      export HOME=/root

      # Remove insecure settings left by older versions of this provisioner.
      rm -f /etc/curlrc /root/.npmrc /etc/apt/apt.conf.d/99no-verify

      # Install system packages
      apt-get update -qq
      apt-get install -y -qq \
        ca-certificates openjdk-21-jdk maven mysql-server nginx git curl openssl

      # OrbStack exposes the macOS filesystem to the VM. When Netskope is installed,
      # trust its corporate root and tenant CA instead of disabling TLS verification.
      netskope_ca_dir="/Library/Application Support/Netskope/STAgent/data"
      if [[ -r "${netskope_ca_dir}/nscacert.pem" && \
            -r "${netskope_ca_dir}/nstenantcert.pem" ]]; then
        install -m 0644 "${netskope_ca_dir}/nscacert.pem" \
          /usr/local/share/ca-certificates/netskope-root.crt
        install -m 0644 "${netskope_ca_dir}/nstenantcert.pem" \
          /usr/local/share/ca-certificates/netskope-tenant.crt
        update-ca-certificates
      fi
      # A previous interrupted run may have left units repeatedly restarting.
      systemctl stop auth-service issue-service api-gateway 2>/dev/null || true

      # Create the runtime identity before systemd can start an application unit.
      useradd --system --no-create-home --shell /usr/sbin/nologin issueapp 2>/dev/null || true
      chgrp issueapp /etc/issue-tracker/*.env

      # Replace the committed placeholder with one shared random signing key.
      jwt_secret="$(openssl rand -hex 32)"
      sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${jwt_secret}/" \
        /etc/issue-tracker/auth-service.env \
        /etc/issue-tracker/issue-service.env \
        /etc/issue-tracker/api-gateway.env

      # Start MySQL and wait until it accepts connections
      systemctl enable --now mysql
      for i in $(seq 1 30); do
        mysqladmin ping --silent && break
        sleep 3
      done
      mysqladmin ping --silent

      # Create databases + user
      mysql -u root <<'SQL'
      CREATE DATABASE IF NOT EXISTS authdb  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS issuedb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS 'appuser'@'localhost' IDENTIFIED BY 'StrongPass@2024!';
      GRANT ALL PRIVILEGES ON authdb.*  TO 'appuser'@'localhost';
      GRANT ALL PRIVILEGES ON issuedb.* TO 'appuser'@'localhost';
      FLUSH PRIVILEGES;
      SQL

      # Clone on the first run; update cleanly when retrying an interrupted run.
      if [[ -d /opt/issue-tracker/.git ]]; then
        git -C /opt/issue-tracker pull --ff-only origin v1
      else
        git clone --branch v1 --depth 1 \
          https://github.com/amitactive2008/sample-spring-boot-application.git \
          /opt/issue-tracker
      fi

      # Maven builds
      /opt/issue-tracker/auth-service/mvnw -f /opt/issue-tracker/auth-service/pom.xml \
        clean package -DskipTests -B --no-transfer-progress
      /opt/issue-tracker/issue-service/mvnw -f /opt/issue-tracker/issue-service/pom.xml \
        clean package -DskipTests -B --no-transfer-progress
      /opt/issue-tracker/api-gateway/mvnw -f /opt/issue-tracker/api-gateway/pom.xml \
        clean package -DskipTests -B --no-transfer-progress

      chown -R issueapp:issueapp /opt/issue-tracker

      # Nginx
      rm -f /etc/nginx/sites-enabled/default
      ln -sf /etc/nginx/sites-available/issue-tracker /etc/nginx/sites-enabled/issue-tracker
      nginx -t && systemctl enable --now nginx && systemctl reload nginx

      # Spring Boot services
      systemctl daemon-reload
      systemctl enable auth-service issue-service api-gateway
      systemctl restart auth-service
      sleep 20
      systemctl is-active --quiet auth-service
      systemctl restart issue-service
      sleep 10
      systemctl is-active --quiet issue-service
      systemctl restart api-gateway
      sleep 10
      systemctl is-active --quiet api-gateway

      echo "=== Provisioning complete: $(date) ==="
      echo "Run scripts/sync-frontend-to-vm.sh on the Mac to publish the frontend."

runcmd:
  - /opt/provision.sh
