# Plain Kubernetes Secrets for local kind development.
# These replace what ExternalSecrets + AWS Secrets Manager would create in prod.
# Secret *names* must match what the base Deployment manifests reference.
#
# !! FOR LOCAL DEV ONLY — do not use these values in any real environment !!
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: issue-app
type: Opaque
stringData:
  JWT_SECRET: "local-kind-jwt-secret-key-32bytes!!"

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: issue-app
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "game_admin"
  SPRING_DATASOURCE_PASSWORD: "devpassword123"
  JWT_SECRET: "local-kind-jwt-secret-key-32bytes!!"
  # Mail is disabled locally; dummy values prevent Spring Boot from
  # failing on unresolved placeholders in application-prod.properties
  SES_USERNAME: "disabled"
  SES_PASSWORD: "disabled"
  # Admin user seeded by DataSeeder on first startup
  APP_ADMIN_EMAIL: "admin@example.com"
  APP_ADMIN_PASSWORD: "Admin1234!"

---
apiVersion: v1
kind: Secret
metadata:
  name: issue-service-secrets
  namespace: issue-app
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "game_admin"
  SPRING_DATASOURCE_PASSWORD: "devpassword123"
  JWT_SECRET: "local-kind-jwt-secret-key-32bytes!!"
