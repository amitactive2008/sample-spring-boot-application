# Patch: auth-service
#   1. imagePullPolicy: Never — locally loaded image.
#   2. APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD — required by DataSeeder.java
#      (@Value("${app.admin.email}") etc.) but missing from the base Deployment
#      manifest; injected here from the kind secrets.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      containers:
        - name: auth-service
          imagePullPolicy: Never
          env:
            - name: APP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: APP_ADMIN_EMAIL
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: APP_ADMIN_PASSWORD
