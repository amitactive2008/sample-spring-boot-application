# Patch: auth-service Service — replace port 80 with 8097.
# The api-gateway prod routes to http://auth-service:8097 (from application-prod.yml).
# $patch: delete removes the base port 80 before adding port 8097.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - $patch: delete
      port: 80
      protocol: TCP
    - name: http
      protocol: TCP
      port: 8097
      targetPort: 8097
