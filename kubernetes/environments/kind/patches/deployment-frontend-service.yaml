# Patch: frontend-service
#   1. imagePullPolicy: Never — locally loaded image.
#   2. Increase memory limit: react-scripts start (CRA dev server) requires
#      ~512MB-1GB; the base manifest allocates only 256Mi which causes OOMKill.
#      NODE_OPTIONS=--max-old-space-size=512 caps the V8 heap to stay within limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
spec:
  template:
    spec:
      containers:
        - name: frontend-service
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
