# Frontend nginx Ingress — replaces the AWS ALB Ingress in the base layer.
# Keep this resource free of rewrite annotations so React static assets retain
# their original paths. API routing and its /api rewrite live in api-ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: issue-app
spec:
  ingressClassName: nginx
  rules:
    - host: sample-app.kind.local
      http:
        paths:
          # Do not apply the API rewrite to frontend routes or static assets.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
