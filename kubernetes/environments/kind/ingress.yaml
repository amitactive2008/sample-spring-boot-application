# nginx Ingress — replaces the AWS ALB Ingress in the base layer.
#
# Key difference from prod:
#   The prod setup (CloudFront → ALB) strips the /api prefix before
#   the request reaches the api-gateway, which expects /auth/** and /issues/**.
#   Here we reproduce that strip explicitly with nginx's rewrite-target annotation.
#
#   Request flow:
#     Browser  GET /api/auth/login
#     nginx    strips /api  →  forwards  GET /auth/login  to api-gateway:80
#     api-gateway  matches route  Path=/auth/**  →  proxies to auth-service
#
# App is available at http://localhost:8080 (mapped by kind-cluster.yaml)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: issue-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Capture everything after /api and forward it without the prefix
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /api/* → api-gateway (strips the /api prefix)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          # / → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
