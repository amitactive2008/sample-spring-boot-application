{{- if .Values.gatewayAPI.enabled }}
# ──────────────────────────────────────────────────────────────────────────────
# gateway.yaml — Envoy Gateway resources
#
# Three resources are created:
#   1. GatewayClass — selects the Envoy Gateway controller.
#   2. EnvoyProxy  — configures how Envoy Gateway provisions the Envoy proxy
#                    Deployment/Service for this release (NodePort + hostPort
#                    so kind's extraPortMappings route traffic to localhost).
#   3. Gateway     — declares the HTTP and HTTPS listeners; references the
#                    TLS Secret created by cert-manager.
# ──────────────────────────────────────────────────────────────────────────────

---
# Envoy Gateway installs the controller and CRDs, but applications create the
# GatewayClass that selects that controller.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayAPI.gatewayClassName }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
# EnvoyProxy: configure the Envoy proxy deployment for this Gateway.
# Using NodePort + hostPort lets the kind extraPortMappings (80→80, 443→443)
# forward host traffic directly into the Envoy pods running on the kind node.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayAPI.gatewayName }}-proxy-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # NodePort exposes the Envoy proxy on all nodes; kind's extraPortMappings
        # map node ports 80/443 to the same ports on the development machine.
        type: NodePort
      envoyDeployment:
        # Patch the Envoy container to bind hostPort on the kind node.
        # This ties the Envoy pod's container port directly to the host network
        # port, allowing kind's extraPortMappings to route the traffic.
        patch:
          type: StrategicMerge
          value:
            spec:
              # A single-node kind cluster cannot schedule two Envoy pods that
              # both reserve node ports 80/443. Stop the old pod before
              # creating its replacement.
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 0
                  maxUnavailable: 1
              template:
                spec:
                  containers:
                    - name: envoy
                      ports:
                        # Envoy Gateway renders listener 80 on container port
                        # 10080 and listener 443 on 10443. Bind the kind node's
                        # ports to those real listeners.
                        - name: http-80
                          containerPort: 10080
                          hostPort: {{ .Values.gatewayAPI.httpPort }}
                          protocol: TCP
                        - name: https-443
                          containerPort: 10443
                          hostPort: {{ .Values.gatewayAPI.httpsPort }}
                          protocol: TCP

---
# Gateway: declares the listeners that Envoy Gateway provisions Envoy for.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayAPI.gatewayName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
  annotations:
    # Tell cert-manager which ClusterIssuer to use for the HTTPS listener's TLS cert.
    cert-manager.io/cluster-issuer: {{ include "issue-tracker.clusterIssuerName" . | quote }}
spec:
  # Reference the GatewayClass created above for the Envoy controller.
  gatewayClassName: {{ .Values.gatewayAPI.gatewayClassName }}

  # Point the proxy config defined above at this Gateway.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gatewayAPI.gatewayName }}-proxy-config

  listeners:
    # ── HTTP listener — redirects all traffic to HTTPS ──────────────────────
    - name: http
      protocol: HTTP
      port: {{ .Values.gatewayAPI.httpPort }}
      allowedRoutes:
        namespaces:
          from: Same

    # ── HTTPS listener — terminates TLS with cert-manager certificate ───────
    - name: https
      protocol: HTTPS
      port: {{ .Values.gatewayAPI.httpsPort }}
      hostname: {{ .Values.gatewayAPI.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tls.secretName | quote }}
            namespace: {{ .Values.global.namespace }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
