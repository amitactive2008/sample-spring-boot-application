# Plain Kubernetes Secrets.
# In prod these would be created by ExternalSecrets + AWS Secrets Manager.
# Here they are managed directly by Helm so the same Deployment manifests work
# unchanged — the Secret names match exactly what the Deployments reference.
#
# Sensitive values come from Helm --set flags or a sealed-secrets solution;
# do NOT hard-code real credentials in values-prod.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwt.secret | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.db.password | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  # SES SMTP credentials — dummy values are fine when mail.enabled=false
  SES_USERNAME: {{ .Values.authService.mail.sesUsername | quote }}
  SES_PASSWORD: {{ .Values.authService.mail.sesPassword | quote }}
  # Admin seed credentials read by DataSeeder on first startup
  APP_ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  APP_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: issue-service-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.db.password | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
