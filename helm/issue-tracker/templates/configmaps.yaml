---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
data:
  # jdbcUrl helper auto-builds the URL from db.host (or mysql service) + db.name
  SPRING_DATASOURCE_URL: {{ include "issue-tracker.jdbcUrl" . | quote }}
  MAIL_ENABLED: {{ .Values.authService.mail.enabled | toString | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: issue-service-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: {{ include "issue-tracker.jdbcUrl" . | quote }}
