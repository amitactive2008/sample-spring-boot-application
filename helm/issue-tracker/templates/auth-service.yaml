# ── Deployment ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
    {{- include "issue-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authService.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: {{ include "issue-tracker.serviceAccountName" . }}
      containers:
        - name: auth-service
          image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.authService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: {{ .Values.db.ddlAuto | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: JWT_SECRET
            - name: SES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SES_USERNAME
            - name: SES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: SES_PASSWORD
            - name: MAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: MAIL_ENABLED
            # APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD are required by DataSeeder.java
            # (@Value("${app.admin.email}") etc.) but were missing from the
            # base Deployment manifest — they are correctly injected here.
            - name: APP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: APP_ADMIN_EMAIL
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: APP_ADMIN_PASSWORD
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: auth-service
    {{- include "issue-tracker.labels" . | nindent 4 }}
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: {{ .Values.authService.port }}
