spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-signing-key-with-at-least-thirty-two-bytes
jwt.expirationMinutes=60
app.admin.email=admin@example.test
app.admin.password=TestAdmin1234!
mail.enabled=false
mail.from=test@example.test
