# Safe, non-production configuration for local and CI tests.
spring.datasource.url=jdbc:h2:mem:auth_service;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-signing-key-that-is-never-used-in-production
app.admin.email=admin@test.invalid
app.admin.password=test-only-admin-password
mail.from=noreply@test.invalid
mail.enabled=false
spring.mail.host=localhost
