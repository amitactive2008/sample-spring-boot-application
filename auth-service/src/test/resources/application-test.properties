spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:authdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=test-only-signing-secret-that-is-at-least-32-characters
app.admin.email=admin@example.test
app.admin.password=TestAdminPassword123!
mail.enabled=false
mail.from=noreply@example.test
