
# API GATEWAY - Production container routes

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8097}
          predicates:
            - Path=/auth/**

        - id: issue-service
          uri: ${ISSUE_SERVICE_URL:http://issue-service:8098}
          predicates:
            - Path=/issues/**
